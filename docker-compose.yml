services:
  db:
    image: postgres:17-alpine
    container_name: printtrack-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: printtrack
      POSTGRES_USER: printtrack
      POSTGRES_PASSWORD: printtrack
    ports:
      - "5432:5432"
    volumes:
      - printtrack-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printtrack"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: src/PrintTrack.Server/Dockerfile
    container_name: printtrack-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=printtrack;Username=printtrack;Password=printtrack"
      ASPNETCORE_URLS: "http://+:8095"
      PrintTrack__SeedAdminPassword: "ChangeMe!123"
    volumes:
      - printtrack-keys:/keys
    ports:
      # host 8095 -> contenedor 8095 (8080 lo usa leantime)
      - "8095:8095"
    profiles: ["full"]

volumes:
  printtrack-pgdata:
  printtrack-keys:
